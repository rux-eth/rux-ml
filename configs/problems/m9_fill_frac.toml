# M9 problem — y__fill_frac: the fill fraction under the queue rule (D37 #1): the filled fraction of a post-only rung in [0, 1], scored by Brier (D45 #3).
#
# One of the three M9 problems of rux-capital program v0.3 (docs/0.3/DESIGN-log.md
# D37, D45 #3; ACCEPTANCE C9). Each problem trains on ONE label — the column the
# program's EV consumes — and carries the other labels as diagnostics ([m9]).
# The set is the harness's materialized training table (program PR-024,
# ACCEPTANCE C6): day-partitioned parquet, keys stamp_ms/coin/side/kind/p_bp/
# q_usd/h_ms, point-in-time feat__ columns stamped <= t, y__ labels from > t.
# "Default-config GBT per target" (C9): no hyperparameter is set here — the
# XGBoostTraining defaults ARE the default config.
#
# The regime (row-random / time-block purged / symbol holdout) is a STUDY overlay
# (configs/studies/m9_regime_*.toml, PR-042); this file is regime-free beyond the
# time-ordered one-off baseline split.

[data]
# The training set has two per-target subtrees (program PR-024 §Scope, amendment
# A7, operator-approved 2026-09-26): fill/ = the post-only rows (y__fill_frac,
# y__markout_bp), walk/ = the taker rows (y__walk_bp). This problem reads fill/.
# The root is a placeholder under the workbench's gitignored data/ until
# PR-024's materializer lands (symlink the set's root there, or
# --set data.source_path=<root>/fill).
source_path = "data/m9/training_set/fill"
target_column = "y__fill_frac"
# PR-024 (rux-ml): the one-off baseline is time-ordered on the decision stamp
# (Int64 epoch milliseconds, program ACCEPTANCE C6).
split_kind = "time_ordered"
time_column = "stamp_ms"
# PR-042: the time-block regime's embargo, in stamp_ms units (ms); >= [m9] h_max_ms
# is enforced at load (program D41 / D45 #4). Set to the label's reach (see [m9]
# h_max_ms): 28,801,000 ms = ceil 33 bars of the 15-min label grid (program PR-024
# §Findings Q5 / amendment A3 — 33, not the 16 a 4 h h_max would give).
split_embargo = 28801000
# PR-042: the symbol-holdout regime (a study overlay sets split_kind = "symbol_holdout").
# Each coin's partition is fixed by (seed, coin) alone, so every target and every
# nested prefix holds out the same coins; the per-fold coin lists are recorded in
# fold_meta.json. The seed value is an arbitrary operator-reviewable choice.
group_column = "coin"
symbol_holdout_seed = 20260926

[features]
# kind is a low-cardinality string (one value per subtree): below the threshold it
# passes through as a native categorical. BEST-GUESS value, flagged — QUESTION Q2
# for the lead (D4 has no default; rux-ml requires it whenever categoricals matter).
categorical_low_card_threshold = 8

[features.spec]
# The order's own attributes are inputs of P(fill | p, Q, h) (D37 #1); stamp_ms and coin
# are keys, never features (C6). PR-048: `side` is int8 (+1 buy / -1 sell) in the
# materialized set (schema key_dtypes); Polars casts only a string to Categorical, so it
# enters as numeric.
# PR-049 (program D38: the model's features are the feat__ columns; C10: the list comes
# from the schema file): then EVERY feat__ column of THIS problem's subtree (fill/, 28
# columns), named here in the schema's order (rumpy-harness spec/m9_training_schema.json v2,
# vendored at tests/fixtures/) — tests/config/test_m9_problem_configs.py fails until this
# list equals the schema's, so a schema change forces this file to follow. All are float64;
# the ones the schema says can be empty (a thin book, no l2 transition, no return pair,
# beyond the deepest level) arrive null -> NaN, XGBoost's `missing` (a learned default branch).
# feat__queue_ahead_usd (the queue at the order's own price) is fill-only.
numeric_columns = [
    "p_bp", "q_usd", "h_ms", "side",
    "feat__spread_bp",
    "feat__book_age_ms",
    "feat__near_l1_usd",
    "feat__opp_l1_usd",
    "feat__near_depth_usd_10bp",
    "feat__near_depth_usd_30bp",
    "feat__opp_depth_usd_10bp",
    "feat__opp_depth_usd_30bp",
    "feat__qi_l1",
    "feat__near_walk_bp_q1000",
    "feat__near_walk_bp_q3000",
    "feat__top_age_ms",
    "feat__ofi_60s",
    "feat__ofi_300s",
    "feat__rv_bp_300s",
    "feat__rv_bp_3600s",
    "feat__ret_bp_60s",
    "feat__ret_bp_300s",
    "feat__ret_bp_3600s",
    "feat__trade_n_60s",
    "feat__trade_n_300s",
    "feat__same_vol_usd_300s",
    "feat__opp_vol_usd_300s",
    "feat__trade_gap_ms_300s",
    "feat__funding_rate",
    "feat__oi_chg_3600s",
    "feat__ctx_age_ms",
    "feat__queue_ahead_usd",
]
categorical_columns = ["kind"]

[training]
kind = "xgboost"
device = "cuda"
# Regression: routes the factory to XGBRegressor.
metric = "brier"
model_kwargs = { objective = "reg:logistic" }  # a fraction in [0, 1] fits as XGBoost logistic regression; predictions are probabilities

[m9]
# PR-042: h_max = the label's REACH (ms), not the longest markout horizon (program
# PR-024 §Findings Q5, amendment A3, operator-approved 2026-09-26). A filled order's
# markout reads mid(tau + h_mk) with tau <= t + L + h_fill, so a label stamped t reads
# prices up to t + reach, where reach = entry latency (entry_ns, 1 s = 1,000)
# + the order's resting horizon (h_ms = ladder_ttl_intervals x decision_timeframe_ms,
# 4 h = 14,400,000) + max(markout_horizons_ms) (D45 #3, 4 h = 14,400,000)
# = 28,801,000 ms (8 h 0 m 1 s). A 4 h h_max let a label stamped 4-8 h before the
# boundary read past it. Every term is an existing program key: re-derive this (and
# split_embargo) if any of them moves.
h_max_ms = 28801000
# PR-044 (program D45 #3): the fill fraction is scored by Brier alone.
signed_error_honesty = false
# PR-058 (program PR-027 A7, :690, operator-approved 2026-09-28): "fill is gated on Brier,
# with a signed calibration bias per (p, Q, h) bucket reported" — the record carries
# mean(prediction) - mean(realized) on the test rows, overall and per bucket, never gated.
# A bucket = one (p_bp, q_usd, h_ms) cell of the order grid as the rows carry it, no
# binning (program PR-027 P2 grouped the same cells) — LEAN for the program lead.
calibration_bias = true
calibration_bucket_columns = ["p_bp", "q_usd", "h_ms"]
# The other labels of THIS problem's subtree (fill/), summarised per fold beside every
# run and never trained on (D45 #3: "the others diagnostics"). PR-048: the names are the
# harness schema's (spec/m9_training_schema.json v2, program PR-024 B-4) — a label of the
# other subtree is not in these files and refused the run. Left out on purpose:
# y__outcome (constant `ok` on every row the target filter keeps) and, in fill/,
# y__ttf_first_ms / y__ttf_full_ms ("-1 when none", a sentinel the summary would average).
diagnostic_columns = [
    "y__fill_frac_h60000",
    "y__fill_frac_h600000",
    "y__fill_frac_h3600000",
    "y__markout_bp",
    "y__markout_bp_h60000",
    "y__markout_bp_h600000",
    "y__markout_bp_h3600000",
    "y__capture_bp",
    "y__queue_ahead_at_ack",
    "y__through",
]
# PR-048: the materializer WRITES the rows of an order never placed (no_book,
# below_one_lot) or resting nowhere (alo_expired) with a NaN fill fraction ("null unless
# y__outcome is ok", program PR-024 B-4), so this problem trains and scores on the rows
# with a fill fraction only: the row predicate drops the others before the split.
row_filter_non_null = ["y__fill_frac"]
# PR-046 (program D43 / C9): the nested-prefix learning curve at 1/4, 1/2, 3/4, full
# (fractions of the train window; each fit: train --set data.train_prefix_frac=<f>),
# read by `rux-ml runs learning-curve`. The value followed is the held-out score
# (the problem's metric) — BEST-GUESS: D43's "the OOS honesty metric" names no
# scalar — QUESTION Q17 for the lead.
learning_curve_fractions = [0.25, 0.5, 0.75, 1.0]
learning_curve_metric = "score"
learning_curve_direction = "minimize"
# PR-054 (program PR-027 A4, operator-approved 2026-09-28): the row-random regime's
# membership is a keyed hash of the row's identity — the harness schema's keys
# (spec/m9_training_schema.json v2, targets.<subtree>.keys) — seeded by the split seed,
# not a shuffle: reproducible from the row alone, across row orders and library versions.
row_key_columns = ["stamp_ms", "coin", "side", "kind", "p_bp", "q_usd", "h_ms"]

[m9.gates]
# PR-044: the four operator-signed M9 keys (program ACCEPTANCE C9) are read from
# the rux-capital program's signed registry, verified with ssh-keygen -Y against
# the signer named HERE (never the file's own signature block). Paths are relative
# to the rux-ml checkout, assuming the sibling layout ~/projects/{rux-ml,
# rux-capital/program} — QUESTION Q11 for the lead (the desktop's layout).
# Fail closed: until the operator signs the four keys in, M9 training refuses.
path = "../rux-capital/program/config/gates.yaml"
signature_path = "../rux-capital/program/config/gates.yaml.sig"
allowed_signers = "../rux-capital/program/config/allowed_signers"
identity = "operator@rumpy"
namespace = "rumpy-gates"
