# rux-ml — base config (always loaded)
#
# See configs/README.md for layered loading + override precedence (CLI > env >
# .env > study > problem > base > defaults).
#
# Most fields rely on the Pydantic defaults in src/rux_ml/config/<layer>.py.
# Only override here when the project-wide value should differ from the model
# default. Per-problem and per-study TOMLs overlay this via deep_merge.

[data]
# `source_path` and `target_column` MUST be set per problem (see configs/problems/).
# `gpu_in_memory_x_gb_max = 18.0` is the D3 ingest decision-rule threshold.

[data.oracle]
# PR-040 oracle quarantine (program ACCEPTANCE C13): every training-set read
# refuses a source with a column (or nested field) in this namespace, or with
# this tag file in any ancestor / inside it. Mirrors rux-capital harness
# `config/harness.toml` [oracle]. Removing this table refuses all ingest.
namespace = "oracle__"
tag_file = "ORACLE.tag"

[features]
# `categorical_low_card_threshold` deliberately has no default per D4 (BEST-GUESS).
# Set per problem when categoricals matter.

[training]
# Per PR-017: TrainingConfig is a tagged-union over per-family variants —
# `kind` MUST be set explicitly because Pydantic's discriminator dispatch
# runs BEFORE field defaults are applied (same pattern as `[cv]` below).
# Switch via kind ∈ {xgboost} (PR-018 adds lightgbm, PR-019 adds catboost).
# Defaults: device="cuda", tree_method="hist",
# enable_categorical=true, learning_rate=0.1, max_depth=6, n_estimators=100.
kind = "xgboost"

[tuning]
# Defaults: sampler="tpe" (multivariate=true, group=true, n_startup_trials=20,
# constant_liar=true), pruner="wilcoxon" (per PR-007), trial_isolation="subprocess",
# n_trials=50. `trial_timeout_s = null` disables the per-trial wall-clock timeout
# (PR-008); set an integer to kill hanging trials.

[runs]
# Defaults: storage_url="sqlite:///studies/studies.db",
# artifacts_root="studies/artifacts".

[registry]
# Defaults: root="registry", version_format="v_{date}_{short_hash}".

[cv]
# Per PR-015 (Tier-2). Tagged-union over Splitter strategies — `kind` MUST be
# set explicitly because empty `[cv]` can't disambiguate the discriminator.
# Switch via kind ∈ {kfold, stratified_kfold, time_series, group_kfold, cpcv}.
# CPCV (skfolio) requires per-problem embargo_size / purged_size for AFML use.
#
# Only fields present in EVERY variant of CVConfig may live here — variant-
# specific knobs (kfold.shuffle, time_series.gap, cpcv.embargo_size, cpcv.n_folds, ...)
# go in configs/problems/<name>.toml. Enforced by
# tests/config/test_base_toml_discriminator_hygiene.py. The KFoldCV /
# StratifiedKFoldCV / TimeSeriesSplitCV / GroupKFoldCV schemas all default
# n_splits=5; CombinatorialPurgedCV uses n_folds (default 10). Set per
# problem when overriding either.
kind = "kfold"

[memory]
# Defaults: watchdog_threshold_gb=28.0 (BEST-GUESS per D10),
# omp_threads=24, openblas_threads=1, mkl_threads=1, polars_threads=24.
# `cache_host_ratio = null` lets XGBoost auto-estimate the ExtMemQuantileDMatrix
# host-RAM fraction (per D3 ingest path); set explicitly when host RAM is tight.
