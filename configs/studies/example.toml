# Example study overlay (per PR-007). Activate with:
#   rux-ml --problem <name> --study example tune start --n-trials 50
#
# Data lives in configs/problems/<problem>.toml; this file controls the sweep.
# Override precedence (highest → lowest): CLI > env > .env > this study > problem > base.

[tuning]
sampler = "tpe"        # tpe | gp | hebo (hebo requires optunahub + hebo installs)
pruner = "wilcoxon"    # wilcoxon (default, CV-mean regime) | median | hyperband | successive_halving | none
n_trials = 50
n_startup_trials = 20

[cv]
kind = "kfold"
n_splits = 5
shuffle = true

# Search space — dot-paths into RuxMLConfig; each entry becomes a trial.suggest_* call.
[search_space."training.learning_rate"]
type = "float"
low = 1e-3
high = 3e-1
log = true

[search_space."training.max_depth"]
type = "int"
low = 3
high = 10

[search_space."training.subsample"]
type = "float"
low = 0.5
high = 1.0

[search_space."training.colsample_bytree"]
type = "float"
low = 0.5
high = 1.0

[search_space."training.n_estimators"]
type = "int"
low = 100
high = 1000
