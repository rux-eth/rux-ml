[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[project]
name = "rux-ml"
version = "0.1.0"
description = "Personal ML research workbench for tabular GBM lifecycle (XGBoost-first)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rux-eth" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.6",
    "xxhash>=3.7",
    "polars>=1.40",
    "xgboost>=3.1",
    "numpy>=2.0",
    "scikit-learn>=1.4",
    "category-encoders>=2.6",
    "pyarrow>=17",
    "optuna>=4.0",
    "skfolio>=0.20.1",
    "optuna-integration[xgboost]>=4.8.0",
    "skops>=0.10",
    "psutil>=5.9",
    "cvxpy>=1.8.0",
    "clarabel>=0.11.0",
]

[project.scripts]
rux-ml = "rux_ml.cli:app"

[project.optional-dependencies]
lightgbm = [
    "lightgbm>=4.6.0",
]
catboost = [
    "catboost>=1.2.10",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "basedpyright>=1.18",
    "hypothesis>=6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "PL",               # pylint
    "TID",              # tidy imports
    "TCH",              # type-checking imports
]
ignore = [
    "PLR0913",          # too-many-arguments — common in ML config-driven code
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004",  # magic numbers OK in tests
    "TC001",    # don't bother moving imports into TYPE_CHECKING in tests
    "TC002",
    "TC003",
    "SLF001",   # tests may access _private helpers from the module under test
]
# Typer uses `inspect.signature(..., eval_str=True)` and resolves annotations
# at runtime to wire CLI parameters. Moving `typer` / `pathlib.Path` /
# `typer.Context` into TYPE_CHECKING breaks parameter binding with NameError.
"src/rux_ml/cli/**/*.py" = [
    "TC001",
    "TC002",
    "TC003",
]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

# sklearn / category_encoders / hypothesis ship limited type info; tests that
# exercise them produce noisy "Unknown" reports that don't reflect real bugs.
# Library code in src/ stays strict; tests are relaxed for those rules only.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA-capable GPU (skipped on CPU-only machines)",
    "slow: takes more than ~5s (excluded from default run)",
    "golden: golden-dataset regression test (excluded from default run)",
    "integration: multi-component integration test",
    "docker: requires Docker daemon + NVIDIA Container Toolkit (excluded from default run; set RUXML_RUN_DOCKER_TESTS=1 to opt in)",
]
addopts = "-m 'not gpu and not slow and not golden and not docker'"
